name: Gerar APK e Instalador Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci || npm install

      - name: Gerar build do projeto
        run: npm run build

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Sincronizar Capacitor com Android
        run: npx cap sync android || npx cap add android

      - name: Dar permissão de execução ao Gradle
        run: chmod +x android/gradlew

      - name: Gerar APK Debug
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Salvar APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
